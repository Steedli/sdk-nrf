# Enable an upgradable MCUboot chain:
# NSIB (B0) verifies and boots MCUboot, then MCUboot verifies the application.
SB_CONFIG_PARTITION_MANAGER=n
SB_CONFIG_SECURE_BOOT_APPCORE=y
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# nRF54L/LM devices use Ed25519 for secure boot and MCUboot signatures.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y
SB_CONFIG_SECURE_BOOT_SIGNING_KEY_FILE="\${ZEPHYR_MCUBOOT_MODULE_DIR}/root-ed25519.pem"
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="\${ZEPHYR_MCUBOOT_MODULE_DIR}/root-ed25519.pem"

# The NSIB/B0 verification key is provisioned into KMU by the custom sysbuild
# keyfile generation step in sysbuild/CMakeLists.txt. MCUboot's application
# verification key is compiled into MCUboot to keep provisioning simple.
SB_CONFIG_SECURE_BOOT_MCUBOOT_VERSION="0.0.1+2"