# Minimal BLE SMP DFU application for nRF54LM20A.
# For the /ns target, TF-M is built automatically. Keep the default profile so
# the static DTS layout can provide an aligned secure/non-secure flash layout.
CONFIG_USE_DT_CODE_PARTITION=y

CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH=y

# MCUboot application update support.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y

# Application image version used by MCUboot and printed at boot.
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="1.0.2+4"
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--slot-size 0xd1000 --hex-addr 0x42000"

CONFIG_BT_DEVICE_NAME="NCS_DFU_LM20A"

# Stack sizes for Bluetooth SMP DFU requests.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
CONFIG_MAIN_STACK_SIZE=2176

# Logging.
CONFIG_LOG=y
CONFIG_MCUBOOT_UTIL_LOG_LEVEL_WRN=y
CONFIG_LOG_MAX_LEVEL=3
